name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"
      # GitHub Pages lets browsers keep files for 10 minutes: name each deploy's scripts by commit
      # so a visitor gets the new page at once instead of the cached one.
      - name: Version the scripts
        run: |
          V="${GITHUB_SHA::7}"
          sed -i "s/main\.dart\.js/main.dart.js?v=$V/g" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap\.js\"/flutter_bootstrap.js?v=$V\"/" build/web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
